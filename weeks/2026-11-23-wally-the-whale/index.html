// ═══ STATE ═══════════════════════════════════════════════════════════════════
let G = {
  mode: 'little',
  progress: {},  // {dayIdx: {readDone, verseDone}}
  journal: []    // [{lesson, keyRef}]
};

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    G.mode = s.mode || 'little';
    G.progress = s.progress || {};
    G.journal = s.journal || [];
  } catch(e) {}
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({mode:G.mode, progress:G.progress, journal:G.journal})); } catch(e) {}
}

// ═══ HUB ═════════════════════════════════════════════════════════════════════
function setMode(m) {
  G.mode = m;
  document.getElementById('btnLittle').classList.toggle('active', m==='little');
  document.getElementById('btnBig').classList.toggle('active', m==='big');
  saveState();
  renderHub();
}

function renderHub() {
  const today = (new Date().getDay() + 6) % 7; // 0=Mon..6=Sun
  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';
  LEVELS.forEach((lv, idx) => {
    const prog = G.progress[idx] || {};
    const prevDone = idx === 0 || (G.progress[idx-1] || {}).verseDone;
    const locked = !prevDone;
    const isToday = idx === today;
    const readDone = prog.readDone;
    const verseDone = prog.verseDone;

    const card = document.createElement('div');
    card.className = 'day-card';
    card.innerHTML = `
      <div class="day-header" onclick="toggleCard(${idx})">
        <span class="day-num">${lv.dayLabel}</span>
        <span class="day-title">${lv.icon} ${lv.title}</span>
        <div class="badge-row">
          ${readDone ? '<span class="badge">📖</span>' : ''}
          ${verseDone && G.mode==='little' ? '<span class="badge">🐣</span>' : ''}
          ${verseDone && G.mode==='big' ? '<span class="badge">🦅</span>' : ''}
        </div>
        ${isToday ? '<span class="today-chip">TODAY</span>' : ''}
      </div>
      <div class="day-body" id="body-${idx}">
        ${locked
          ? `<p class="lock-msg">🔒 Finish day ${idx} first to unlock</p>`
          : `
          <div style="font-size:.8rem;color:#555">${lv.day}</div>
          ${readDone
            ? `<button class="btn-read" onclick="startRead(${idx})">📖 Read again</button>`
            : `<button class="btn-read" onclick="startRead(${idx})">📖 Read & Answer</button>`}
          ${verseDone
            ? `<button class="btn-play" onclick="startGame(${idx})">🎮 Play again</button>`
            : (readDone
                ? `<button class="btn-read" onclick="startLesson(${idx})">📝 Build key verse</button>`
                : `<button class="btn-locked" disabled>🔒 Read first</button>`)}
          `}
      </div>`;
    grid.appendChild(card);
  });
}

function toggleCard(idx) {
  const body = document.getElementById('body-'+idx);
  const wasOpen = body.classList.contains('open');
  document.querySelectorAll('.day-body').forEach(b => b.classList.remove('open'));
  if (!wasOpen) body.classList.add('open');
}

function showJournal() {
  const el = document.getElementById('journalEntries');
  if (!G.journal.length) {
    el.innerHTML = '<p style="color:#999;font-size:.85rem">No lessons yet — complete a day to add one!</p>';
  } else {
    el.innerHTML = G.journal.map(e =>
      `<div class="journal-entry"><div class="journal-ref">${e.keyRef}</div>${e.lesson}</div>`
    ).join('');
  }
  document.getElementById('journalOverlay').style.display = 'flex';
}

function confirmUnlockAll() {
  if (confirm('Unlock all days? (Parent action)')) {
    LEVELS.forEach((_,i) => { G.progress[i] = G.progress[i] || {}; G.progress[i].readDone = true; });
    saveState(); renderHub();
  }
}
function confirmReset() {
  if (confirm('Reset all progress for this week?')) {
    G.progress = {}; G.journal = []; saveState(); renderHub();
  }
}

// ═══ READING SCREEN ══════════════════════════════════════════════════════════
let R = {}; // reading state
function startRead(dayIdx) {
  R = {dayIdx, partIdx:0, partsDone:0};
  renderReadPart();
}

function renderReadPart() {
  const lv = LEVELS[R.dayIdx];
  const part = lv.parts[R.partIdx];
  const hasEasy = part.verses.some(vr => {
    for (let i = vr.s; i <= vr.e; i++) {
      const key = vr.b.replace('Amos ','Amos ').replace(' ','').replace('Amos','Amos ')
                      .replace('Obadiah','Obadiah ').replace('Jonah','Jonah ');
      // Check EASY set
    }
    return false;
  });
  // Build verse HTML
  let verseHtml = '';
  part.verses.forEach(vr => {
    for (let n = vr.s; n <= vr.e; n++) {
      const book = vr.b;
      const key = `${book} ${n}`;
      // e.g. 'Amos 3:7'
      const bookShort = book.split(' ').slice(0,-1).join(' ') || book;
      const chapter = parseInt(book.split(' ').pop());
      const easyKey = `${book.replace(' ','')}_${n}`;
      // Build easy lookup key like "Amos 3:7"
      const bookName = book.replace(/\s+\d+$/, '');
      const ch = parseInt(book.match(/\d+$/)[0]);
      const easyRef = `${bookName} ${ch}:${n}`;
      const isEasy = EASY.has(easyRef);
      const txt = TEXT[book] ? TEXT[book][n] || '' : '';
      if (!txt) continue;
      verseHtml += `<span style="${isEasy?'font-weight:700;color:#3f37c9':''}">${n} ${txt}</span> `;
    }
  });

  // Check if any verse in this part is easy
  let hasEasyVerse = false;
  part.verses.forEach(vr => {
    const bookName = vr.b.replace(/\s+\d+$/, '');
    const ch = parseInt(vr.b.match(/\d+$/)[0]);
    for (let n = vr.s; n <= vr.e; n++) {
      if (EASY.has(`${bookName} ${ch}:${n}`)) hasEasyVerse = true;
    }
  });

  showScreen(`
    <div class="scr-header">
      <button class="back-btn" onclick="goHub()">←</button>
      <span class="scr-title">${LEVELS[R.dayIdx].icon} ${LEVELS[R.dayIdx].title}</span>
    </div>
    <div class="read-card">
      <div class="part-header">📖 Part ${R.partIdx+1} of 3 &nbsp;·&nbsp; ${part.ref}</div>
      ${hasEasyVerse ? '<div class="easy-legend">Bold blue = easy verse for little readers</div>' : ''}
      <div class="verse-block">${verseHtml}</div>
      <div class="word-help">💬 Word help: ${part.wordHelp}</div>
      <a class="gl-link" href="${part.glUrl}" target="_blank">📗 Open in Gospel Library</a>
      <button class="ask-btn" onclick="showPartQ(${R.dayIdx},${R.partIdx})">✅ We read it out loud! Ask me →</button>
    </div>
  `);
}

function showPartQ(dayIdx, partIdx) {
  const lv = LEVELS[dayIdx];
  const part = lv.parts[partIdx];
  const shuffled = [...part.opts];
  for (let i = shuffled.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]];
  }
  const correct = part.opts[0];
  const qHtml = `
    <div class="quiz-overlay" id="qOverlay">
      <div class="quiz-box">
        <div class="quiz-q">${part.q}</div>
        <div class="quiz-opts" id="qOpts">
          ${shuffled.map(o => `<button class="quiz-opt" onclick="checkPartQ(this,'${o.replace(/'/g,"\\'")}','${correct.replace(/'/g,"\\'")}',${dayIdx},${partIdx})">${o}</button>`).join('')}
        </div>
        <div class="quiz-feedback" id="qFeedback"></div>
      </div>
    </div>`;
  document.getElementById('screen').insertAdjacentHTML('beforeend', qHtml);
}

function checkPartQ(btn, chosen, correct, dayIdx, partIdx) {
  const fb = document.getElementById('qFeedback');
  if (chosen === correct) {
    fb.className = 'quiz-feedback right';
    fb.textContent = '✅ That\'s right!';
    document.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
    setTimeout(() => {
      document.getElementById('qOverlay').remove();
      R.partIdx++;
      if (R.partIdx < 3) {
        renderReadPart();
      } else {
        G.progress[dayIdx] = G.progress[dayIdx] || {};
        G.progress[dayIdx].readDone = true;
        saveState();
        startLesson(dayIdx);
      }
    }, 900);
  } else {
    fb.className = 'quiz-feedback wrong';
    fb.textContent = `❌ Look again: ${LEVELS[dayIdx].parts[partIdx].hint}`;
    document.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
    setTimeout(() => {
      document.getElementById('qOverlay').remove();
      showPartQ(dayIdx, partIdx);
    }, 2800);
  }
}

// ═══ LESSON / VERSE BUILDER ═══════════════════════════════════════════════════
let VB = {};
function startLesson(dayIdx) {
  const lv = LEVELS[dayIdx];
  VB = {dayIdx, chips: [...lv.key], placed: [], done: false};
  // Shuffle chips
  for (let i = VB.chips.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [VB.chips[i],VB.chips[j]] = [VB.chips[j],VB.chips[i]];
  }
  renderLesson();
}

function renderLesson() {
  const lv = LEVELS[VB.dayIdx];
  const modeLabel = G.mode === 'little' ? 'Little' : 'Big';
  const ask = G.mode === 'little' ? lv.askL : lv.askB;
  showScreen(`
    <div class="scr-header">
      <button class="back-btn" onclick="goHub()">←</button>
      <span class="scr-title">📝 Today's Lesson</span>
    </div>
    <div class="verse-build-area">
      <div class="lesson-box">💡 ${lv.lesson}</div>
      <div class="keyref">🧩 Build the key verse: ${lv.keyRef}</div>
      <div class="slots" id="slotArea">
        ${VB.placed.map(p => `<span class="chip placed" onclick="removeChip('${p.replace(/'/g,"\\'")}')">  ${p}</span>`).join('')}
      </div>
      <div class="chips" id="chipPool">
        ${VB.chips.map(c => `<span class="chip pool" onclick="placeChip('${c.replace(/'/g,"\\'")}')">  ${c}</span>`).join('')}
      </div>
      <div class="build-feedback" id="buildFeedback"></div>
      <div style="font-size:.85rem;color:#555;margin-top:4px">💬 ${modeLabel}: ${ask}</div>
    </div>
  `);
}

function placeChip(chip) {
  if (VB.done) return;
  const lv = LEVELS[VB.dayIdx];
  const nextExpected = lv.key[VB.placed.length];
  if (chip === nextExpected) {
    VB.placed.push(chip);
    VB.chips = VB.chips.filter(c => c !== chip);
    if (VB.placed.length === lv.key.length) {
      VB.done = true;
      G.progress[VB.dayIdx] = G.progress[VB.dayIdx] || {};
      G.progress[VB.dayIdx].verseDone = true;
      if (!G.journal.find(e => e.keyRef === lv.keyRef)) {
        G.journal.push({lesson: lv.lesson, keyRef: lv.keyRef});
      }
      saveState();
      showVerseWin(VB.dayIdx);
      return;
    }
    renderLesson();
  } else {
    // Flash wrong
    const chips = document.querySelectorAll('#chipPool .chip');
    chips.forEach(el => { if (el.textContent.trim() === chip.trim()) el.classList.add('wrong-flash'); });
    setTimeout(() => chips.forEach(el => el.classList.remove('wrong-flash')), 500);
  }
}

function removeChip(chip) {
  if (VB.done) return;
  VB.placed = VB.placed.filter(c => c !== chip);
  VB.chips.unshift(chip);
  renderLesson();
}

function showVerseWin(dayIdx) {
  const lv = LEVELS[dayIdx];
  const modeLabel = G.mode === 'little' ? 'Little' : 'Big';
  const ask = G.mode === 'little' ? lv.askL : lv.askB;
  showScreen(`
    <div class="scr-header">
      <button class="back-btn" onclick="goHub()">←</button>
      <span class="scr-title">✅ Verse Built!</span>
    </div>
    <div class="verse-build-area">
      <div class="lesson-box">💡 ${lv.lesson}</div>
      <div class="keyref">${lv.keyRef}</div>
      <div class="slots">${lv.key.map(p => `<span class="chip placed">${p}</span>`).join('')}</div>
      <div style="color:#155724;font-weight:700;text-align:center;padding:8px">🎉 Added to Watchman's Journal!</div>
      <div style="font-size:.85rem;color:#555">💬 ${modeLabel}: ${ask}</div>
      <button onclick="startGame(${dayIdx})" style="background:#0077b6;color:#fff;border:none;border-radius:12px;padding:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px">🎮 Play today's game →</button>
      <button onclick="goHub()" style="background:#eee;color:#333;border:none;border-radius:12px;padding:10px;font-size:.9rem;cursor:pointer">← Back to all days</button>
    </div>
  `);
}

// ═══ GAMES ══════════════════════════════════════════════════════════════════
function startGame(dayIdx) {
  const lv = LEVELS[dayIdx];
  switch(lv.game) {
    case 'explore': startExplore(dayIdx); break;
    case 'laneDefense': startLaneDefense(dayIdx); break;
    case 'fetchBoss': startFetchBoss(dayIdx); break;
    case 'incremental': startIncremental(dayIdx); break;
    case 'wander': startWander(dayIdx); break;
    case 'jonah': startJonah(dayIdx); break;
    case 'storm': startStorm(dayIdx); break;
  }
}

// ── Shared game utilities ────────────────────────────────────────────────────
function gameHeader(dayIdx, score, goal, lives, timerLeft) {
  const lv = LEVELS[dayIdx];
  const bigKids = G.mode === 'big';
  return `
    <div class="info-bar">
      <span>${lv.icon} ${score}/${goal}</span>
      ${bigKids && lives !== null ? `<span class="lives-row">${'❤️'.repeat(Math.max(0,lives))}</span>` : ''}
      ${bigKids && timerLeft !== null ? `<span class="timer-txt">⏱ ${timerLeft}s</span>` : ''}
    </div>
    <div class="progress-bar-wrap" style="position:absolute;top:34px;left:4px;right:4px;z-index:5">
      <div class="progress-bar-fill" id="progBar" style="width:${Math.min(100,score/goal*100)}%"></div>
    </div>`;
}

function burst(wrap, x, y, emoji) {
  const b = document.createElement('div');
  b.className = 'burst';
  b.textContent = emoji;
  b.style.left = x + 'px';
  b.style.top = y + 'px';
  wrap.appendChild(b);
  setTimeout(() => b.remove(), 700);
}

function showMidQ(cfg, onCorrect) {
  const q = cfg;
  const shuffled = [...q.o];
  for (let i = shuffled.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]];
  }
  const correct = q.o[0];
  const ov = document.createElement('div');
  ov.className = 'mid-overlay';
  ov.innerHTML = `
    <div class="quiz-box">
      <div style="font-weight:700;font-size:.9rem;margin-bottom:4px">🏁 Checkpoint!</div>
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-opts" id="midOpts">
        ${shuffled.map(o => `<button class="quiz-opt" data-val="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}
      </div>
      <div class="quiz-feedback" id="midFb"></div>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.onclick = () => {
      const val = btn.getAttribute('data-val');
      if (val === correct) {
        document.getElementById('midFb').className = 'quiz-feedback right';
        document.getElementById('midFb').textContent = '✅ Correct! Keep going!';
        btn.style.background = '#d4edda';
        ov.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
        setTimeout(() => { ov.remove(); onCorrect(); }, 900);
      } else {
        document.getElementById('midFb').className = 'quiz-feedback wrong';
        document.getElementById('midFb').textContent = `❌ ${q.look}`;
        ov.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
        setTimeout(() => {
          ov.remove();
          showMidQ(cfg, onCorrect);
        }, 2800);
      }
    };
  });
}

function showWin(dayIdx, onReplay) {
  const lv = LEVELS[dayIdx];
  const modeLabel = G.mode === 'little' ? 'Little' : 'Big';
  const ask = G.mode === 'little' ? lv.askL : lv.askB;
  G.progress[dayIdx] = G.progress[dayIdx] || {};

  saveState();
  const ov = document.createElement('div');
  ov.className = 'win-overlay';
  ov.innerHTML = `

      <div class="win-emoji">🐋</div>
      <div class="win-title">Great job!</div>
      <div class="win-lesson">💡 ${lv.lesson}</div>
      <div class="win-q">🏠 Bring it home (${modeLabel}): ${ask}</div>
      <button class="win-btn" onclick="this.closest('.win-overlay').remove();goHub()">← All days</button>
      <button class="win-btn" style="background:#eee;color:#333" onclick="this.closest('.win-overlay').remove();${onReplay}">🔄 Play again</button>
    </div>`;

}

// ── EXPLORE GAME (Mon) ─────────────────────────────────────────────────────
function startExplore(dayIdx) {
  const lv = LEVELS[dayIdx];
  const cfg = lv.gameConfig;
  const bigKids = G.mode === 'big';
  const goal = bigKids ? Math.ceil(cfg.goal * 1.6) : cfg.goal;
  let score = 0, lives = 3, timer = 70, midDone = false, gameOver = false;
  let items = [];

  showScreen(`
    <div class="scr-header">
      <button class="back-btn" onclick="gameOver_=true;goHub()">←</button>
      <span class="scr-title">${lv.icon} ${lv.title}</span>
    </div>
    <div style="font-size:.8rem;color:#caf0f8;text-align:center">${cfg.hint}</div>
    <div class="game-wrap" id="gWrap" style="background:${cfg.bg}">
      ${gameHeader(dayIdx, score, goal, lives, timer)}
      <div class="game-canvas" id="gCanvas"></div>
    </div>
  `);

  const wrap = document.getElementById('gWrap');
  const canvas = document.getElementById('gCanvas');
  const W = wrap.offsetWidth, H = wrap.offsetHeight;

  // Wally (player)
  const wally = document.createElement('div');
  wally.style.cssText = `position:absolute;font-size:2.4rem;z-index:5;transition:all .15s;cursor:pointer;`;
  wally.textContent = '🐋';
  wally.style.left = (W/2-20)+'px';
  wally.style.top = (H/2-20)+'px';
  canvas.appendChild(wally);

  // Touch/click to move Wally
  wrap.addEventListener('click', e => {
    if (gameOver) return;
    const r = wrap.getBoundingClientRect();
    wally.style.left = (e.clientX - r.left - 24) + 'px';
    wally.style.top = (e.clientY - r.top - 24) + 'px';
  });
  wrap.addEventListener('touchmove', e => {
    e.preventDefault();
    if (gameOver) return;
    const t = e.touches[0];
    const r = wrap.getBoundingClientRect();
    wally.style.left = (t.clientX - r.left - 24) + 'px';
    wally.style.top = (t.clientY - r.top - 24) + 'px';
  }, {passive:false});

  function spawnItem() {
    if (gameOver) return;
    const isScroll = Math.random() < 0.7;
    const el = document.createElement('div');
    el.className = 'item';
    el.textContent = isScroll ? '📜' : '🪤';
    el.style.left = (20 + Math.random() * (W - 60)) + 'px';
    el.style.top = (60 + Math.random() * (H - 120)) + 'px';
    canvas.appendChild(el);
    items.push({el, isScroll});
    el.addEventListener('click', () => {
      if (gameOver) return;
      const r = el.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
      burst(canvas, parseFloat(el.style.left), parseFloat(el.style.top), isScroll ? '✨' : '💥');
      el.remove();
      items = items.filter(it => it.el !== el);
      if (isScroll) {
        score++;
        document.querySelector('.info-bar span').textContent = `${lv.icon} ${score}/${goal}`;
        document.getElementById('progBar').style.width = Math.min(100, score/goal*100)+'%';
        if (!midDone && score >= Math.floor(goal/2)) {
          midDone = true;
          pauseGame = true;
          showMidQ(lv.gameConfig.mid, () => { pauseGame = false; });
        }
        if (score >= goal) { gameOver = true; showWin(dayIdx, `startExplore(${dayIdx})`); }
      } else {
        if (bigKids) {
          lives--;
          document.querySelector('.lives-row').textContent = '❤️'.repeat(Math.max(0,lives));
          if (lives <= 0) { gameOver = true; showGameOver(dayIdx); }
        }
      }
    });
    setTimeout(() => { if (!gameOver) el.remove(); items = items.filter(it=>it.el!==el); }, 3500);
  }

  let pauseGame = false;
  const spawnInt = setInterval(() => { if (!gameOver && !pauseGame) spawnItem(); }, 900);
  if (bigKids) {
    const timerInt = setInterval(() => {
      if (gameOver) { clearInterval(timerInt); return; }
      if (!pauseGame) {
        timer--;
        const tt = document.querySelector('.timer-txt');
        if (tt) tt.textContent = `⏱ ${timer}s`;
        if (timer <= 0) { gameOver = true; clearInterval(timerInt); clearInterval(spawnInt); showGameOver(dayIdx); }
      }
    }, 1000);
  }
  // Cleanup on nav
  wrap._cleanup = () => { gameOver = true; clearInterval(spawnInt); };
}

function showGameOver(dayIdx) {
  const ov = document.createElement('div');
  ov.className = 'win-overlay';
  ov.innerHTML = `<div class="win-box">
    <div class="win-emoji">😤</div>
    <div class="win-title" style="color:#c00">Time's up!</div>
    <button class="win-btn" onclick="this.closest('.win-overlay').remove();startGame(${dayIdx})">Try again</button>
    <button class="win-btn" style="background:#eee;color:#333" onclick="this.closest('.win-overlay').remove();goHub()">← All days</button>
  </div>`;
  document.body.appendChild(ov);
}

// ── LANE DEFENSE (Tue) ────────────────────────────────────────────────────────
function startLaneDefense(dayIdx) {
  const lv = LEVELS[dayIdx];
  const cfg = lv.gameConfig;
  const bigKids = G.mode === 'big';
  const goal = bigKids ? Math.ceil(cfg.goal * 1.6) : cfg.goal;
  let score = 0, midDone = false, gameOver = false, currency = 30;
  let defenders = []; // {lane, x, el}
  let enemies = [];   // {lane, x, hp, el}
  let projs = [];
  let raf;

  showScreen(`
    <div class="scr-header">
      <button class="back-btn" onclick="gameOver=true;cancelAnimationFrame(raf);goHub()">←</button>
      <span class="scr-title">${lv.icon} ${lv.title}</span>
    </div>
    <div style="font-size:.8rem;color:#caf0f8;text-align:center">${cfg.hint}</div>
    <div class="game-wrap" id="gWrap" style="background:${cfg.bg}">
      ${gameHeader(dayIdx, score, goal, bigKids ? 3 : null, null)}
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;z-index:2" id="lanesWrap"></div>
      <div class="currency-bar">
        <span>✨ <span id="currVal">${currency}</span></span>
        <button class="buy-btn" onclick="buyDefender(0)">Row 1 (10)</button>
        <button class="buy-btn" onclick="buyDefender(1)">Row 2 (10)</button>
        <button class="buy-btn" onclick="buyDefender(2)">Row 3 (10)</button>
      </div>
    </div>
  `);

  const wrap = document.getElementById('gWrap');
  const W = wrap.offsetWidth, H = wrap.offsetHeight;
  const laneH = (H - 70) / cfg.lanes;
  const lanesWrap = document.getElementById('lanesWrap');
  lanesWrap.style.bottom = '70px';
  lanesWrap.style.top = '50px';

  // Draw lane dividers
  for (let i = 0; i < cfg.lanes; i++) {
    const lane = document.createElement('div');
    lane.className = 'lane';
    lane.style.cssText = `flex:1;border-bottom:1px solid rgba(255,255,255,.1);position:relative;`;
    lanesWrap.appendChild(lane);
  }

  window.buyDefender = (lane) => {
    if (currency < 10 || gameOver) return;
    currency -= 10;
    document.getElementById('currVal').textContent = currency;
    // Place at a good spot
    const x = 60 + Math.random() * (W * 0.3);
    const laneEl = lanesWrap.children[lane];
    const def = document.createElement('div');
    def.style.cssText = `position:absolute;font-size:1.6rem;bottom:4px;left:${x}px;z-index:3`;
    def.textContent = cfg.defender;
    laneEl.appendChild(def);
    defenders.push({lane, x, el:def, laneEl, lastShot:0});
  };

  // Spawn enemies
  let spawnTimer = 0;
  const ENEMY_SPEED = bigKids ? 55 : 40;

  function spawnEnemy() {
    const lane = Math.floor(Math.random() * cfg.lanes);
    const laneEl = lanesWrap.children[lane];
    const en = document.createElement('div');
    en.style.cssText = `position:absolute;font-size:1.6rem;bottom:4px;right:0;z-index:3`;
    en.textContent = cfg.enemies[Math.floor(Math.random()*cfg.enemies.length)];
    laneEl.appendChild(en);
    enemies.push({lane, x:W+10, hp:3, el:en, laneEl});
  }

  // Currency trickle
  const currInt = setInterval(() => {
    if (gameOver) return;
    currency += bigKids ? 2 : 3;
    document.getElementById('currVal').textContent = currency;
  }, 1500);

  let last = 0;
  function loop(ts) {
    if (gameOver) return;
    const dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    spawnTimer += dt;
    if (spawnTimer > (bigKids ? 2.5 : 3.5)) {
      spawnTimer = 0;
      spawnEnemy();
    }

    // Move enemies
    enemies = enemies.filter(en => {
      en.x -= ENEMY_SPEED * dt;
      en.el.style.right = '';
      en.el.style.left = en.x + 'px';
      if (en.x < 20) {
        en.el.remove();
        return false;
      }
      return true;
    });

    // Defenders shoot
    defenders.forEach(def => {
      const now = ts;
      if (now - def.lastShot > 1200) {
        // Find closest enemy in same lane
        const target = enemies.filter(e => e.lane === def.lane && e.x > def.x).sort((a,b)=>a.x-b.x)[0];
        if (target) {
          def.lastShot = now;
          // Create projectile
          const pr = document.createElement('div');
          pr.style.cssText = `position:absolute;font-size:1.1rem;bottom:14px;left:${def.x+20}px;z-index:4`;
          pr.textContent = cfg.bullet;
          def.laneEl.appendChild(pr);
          let px = def.x + 20;
          const prInt = setInterval(() => {
            px += 220 * 0.03;
            pr.style.left = px+'px';
            if (px >= target.x) {
              pr.remove();
              clearInterval(prInt);
              target.hp--;
              if (target.hp <= 0) {
                target.el.remove();
                enemies = enemies.filter(e => e !== target);
                score++;
                document.querySelector('.info-bar span').textContent = `${lv.icon} ${score}/${goal}`;
                document.getElementById('progBar').style.width = Math.min(100,score/goal*100)+'%';
                if (!midDone && score >= Math.floor(goal/2)) {
                  midDone = true;
                  gameOver = true;
                  cancelAnimationFrame(raf);
                  showMidQ(lv.gameConfig.mid, () => { gameOver = false; raf = requestAnimationFrame(loop); });
                }
                if (score >= goal) {
                  gameOver = true;
                  cancelAnimationFrame(raf);
                  clearInterval(currInt);
                  showWin(dayIdx, `startLaneDefense(${dayIdx})`);
                }
              }
            }
          }, 30);
        }
      }
    });

    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);
}

// ── FETCH BOSS (Wed) ──────────────────────────────────────────────────────────
function startFetchBoss(dayIdx) {
  const lv = LEVELS[dayIdx];
  const cfg = lv.gameConfig;
  const bigKids = G.mode === 'big';
  let bossHp = cfg.bossHp, score = 0, midDone = false, gameOver = false;
  let carrying = false, px = 100, py = 200, raf;
  let thorns = [];

  showScreen(`
    <div class="scr-header">
      <button class="back-btn" onclick="gameOver=true;cancelAnimationFrame(raf);goHub()">←</button>
      <span class="scr-title">${lv.icon} ${lv.title}</span>
    </div>
    <div style="font-size:.8rem;color:#caf0f8;text-align:center">${cfg.hint}</div>
    <div class="game-wrap" id="gWrap" style="background:${cfg.bg}">
      <div class="boss-hp-bar"><div class="boss-hp-fill" id="bossHpBar" style="width:100%"></div></div>
      <div style="position:absolute;top:28px;left:0;right:0;text-align:center;color:#fff;font-size:.75rem;font-weight:700;z-index:5">Boss HP</div>
      <div class="game-canvas" id="gCanvas"></div>
    </div>
  `);

  const wrap = document.getElementById('gWrap');
  const canvas = document.getElementById('gCanvas');
  const W = wrap.offsetWidth, H = wrap.offsetHeight;

  // Boss
  const bossEl = document.createElement('div');
  bossEl.className = 'boss-sprite';
  bossEl.textContent = cfg.boss;
  bossEl.style.cssText = `position:absolute;font-size:3.5rem;right:20px;top:80px;z-index:3;transition:transform .2s`;
  canvas.appendChild(bossEl);

  // Pickup
  let pickupX = W/2 - 20, pickupY = H/2;
  const pickEl = document.createElement('div');
  pickEl.textContent = cfg.pickup;
  pickEl.style.cssText = `position:absolute;font-size:2rem;z-index:4;animation:glow 1s ease-in-out infinite`;
  pickEl.style.left = pickupX+'px'; pickEl.style.top = pickupY+'px';
  canvas.appendChild(pickEl);

  // Player
  const playerEl = document.createElement('div');
  playerEl.textContent = cfg.player;
  playerEl.style.cssText = `position:absolute;font-size:2rem;z-index:5;left:${px}px;top:${py}px`;
  canvas.appendChild(playerEl);

  // Info
  const infoEl = document.createElement('div');
  infoEl.style.cssText = `position:absolute;top:5px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:.85rem;z-index:6`;
  infoEl.textContent = carrying ? `🌟 Carry it to the ${cfg.boss}!` : `Grab ${cfg.pickup}`;
  canvas.appendChild(infoEl);

  // Touch/move
  wrap.addEventListener('click', e => moveTo(e.clientX, e.clientY));
  wrap.addEventListener('touchmove', e => { e.preventDefault(); moveTo(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
  function moveTo(cx,cy) {
    const r = wrap.getBoundingClientRect();
    px = Math.max(0, Math.min(W-40, cx - r.left - 20));
    py = Math.max(50, Math.min(H-40, cy - r.top - 20));
  }

  // Spawn thorns
  function spawnThorn() {
    if (gameOver) return;
    const tEl = document.createElement('div');
    tEl.textContent = '🌵';
    const tx = Math.random()*(W-40)+10, ty = 60+Math.random()*(H-120);
    tEl.style.cssText = `position:absolute;font-size:1.3rem;left:${tx}px;top:${ty}px;z-index:3`;
    canvas.appendChild(tEl);
    thorns.push({el:tEl,x:tx,y:ty});
    setTimeout(() => { if (!gameOver) { tEl.remove(); thorns=thorns.filter(t=>t.el!==tEl); } }, 3000);
  }
  const thornInt = setInterval(() => { if (!gameOver) spawnThorn(); }, bigKids ? 1800 : 2500);

  let last = 0;
  function loop(ts) {
    if (gameOver) return;
    const dt = Math.min(0.05, (ts-last)/1000);
    last = ts;

    playerEl.style.left = px+'px'; playerEl.style.top = py+'px';

    if (!carrying) {
      // Check pickup collision
      const dx = px - pickupX, dy = py - pickupY;
      if (Math.sqrt(dx*dx+dy*dy) < 36) {
        carrying = true;
        pickEl.style.display = 'none';
        infoEl.textContent = `🌟 Carry it to the ${cfg.boss}!`;
        playerEl.textContent = cfg.player + cfg.pickup;
      }
    } else {
      // Check boss collision
      const br = bossEl.getBoundingClientRect(), pr = playerEl.getBoundingClientRect(), cr = canvas.getBoundingClientRect();
      const bx = parseFloat(bossEl.style.right || '20'), by = parseFloat(bossEl.style.top || '80');
      const dist = Math.sqrt((px-(W-70))*(px-(W-70))+(py-90)*(py-90));
      if (dist < 55) {
        carrying = false;
        bossHp--;
        document.getElementById('bossHpBar').style.width = Math.max(0,bossHp/cfg.bossHp*100)+'%';
        bossEl.style.transform = 'scale(1.4)';
        setTimeout(()=>bossEl.style.transform='',300);
        playerEl.textContent = cfg.player;
        score++;
        // Respawn pickup
        pickupX = 20+Math.random()*(W/2-40); pickupY = 60+Math.random()*(H-120);
        pickEl.style.left=pickupX+'px'; pickEl.style.top=pickupY+'px';
        pickEl.style.display='';
        infoEl.textContent = `Grab ${cfg.pickup}`;
        if (!midDone && score >= Math.ceil(cfg.bossHp/2)) {
          midDone = true;
          gameOver = true;
          cancelAnimationFrame(raf);
          showMidQ(lv.gameConfig.mid, ()=>{ gameOver=false; raf=requestAnimationFrame(loop); });
        }
        if (bossHp <= 0) {
          gameOver = true;
          cancelAnimationFrame(raf);
          clearInterval(thornInt);
          showWin(dayIdx, `startFetchBoss(${dayIdx})`);
          return;
        }
      }
    }

    // Check thorn collision (big kids)
    if (bigKids && carrying) {
      thorns.forEach(t => {
        const dist = Math.sqrt((px-t.x)*(px-t.y)+(py-t.y)*(py-t.y));
        if (dist < 28) {
          carrying = false;
          playerEl.textContent = cfg.player;
          pickEl.style.display='';
          infoEl.textContent = `Grab ${cfg.pickup}`;
        }
      });
    }

    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);
}

// ── INCREMENTAL (Thu) ────────────────────────────────────────────────────────
function startIncremental(dayIdx) {
  const lv = LEVELS[dayIdx];
  const cfg = lv.gameConfig;
  const bigKids = G.mode === 'big';
  const goal = bigKids ? Math.ceil(cfg.goal * 1.5) : cfg.goal;
  let words = 0, midDone = false, gameOver = false;
  let upgrades = cfg.upgrades.map((u,i) => ({...u, owned:false}));
  let autoRate = 0;
  let autoInt;

  function render() {
    showScreen(`
      <div class="scr-header">
        <button class="back-btn" onclick="clearInterval(autoInt);goHub()">←</button>
        <span class="scr-title">${lv.icon} ${lv.title}</span>
      </div>
      <div style="font-size:.8rem;color:#caf0f8;text-align:center">${cfg.hint}</div>
      <div class="game-wrap" id="gWrap" style="background:${cfg.bg};overflow:visible">
        <div class="incr-wrap">
          <div class="word-counter">${Math.floor(words)}</div>
          <div class="word-label">Words of God gathered (goal: ${goal})</div>
          <div class="progress-bar-wrap" style="width:90%"><div class="progress-bar-fill" style="width:${Math.min(100,words/goal*100)}%"></div></div>
          <button class="tap-btn" id="tapBtn" onclick="tapWord()">${cfg.tapItem}</button>
          <div class="upgrades-col">
            ${upgrades.map((u,i) => `
              <button class="upg-btn ${words>=u.cost&&!u.owned?'unlocked':''}" id="upg-${i}"
                ${u.owned?'disabled':''} onclick="buyUpgrade(${i})">
                <span>${u.owned?'✅':''} ${u.name}</span>
                <span>${u.owned?'active':'Cost: '+u.cost}</span>
              </button>`).join('')}
          </div>
        </div>
      </div>
    `);
    document.getElementById('tapBtn').addEventListener('click', tapWord);
  }

  window.tapWord = () => {
    if (gameOver) return;
    words++;
    checkProgress();
    updateDisplay();
  };

  window.buyUpgrade = (i) => {
    if (words < upgrades[i].cost || upgrades[i].owned || gameOver) return;
    words -= upgrades[i].cost;
    upgrades[i].owned = true;
    autoRate += upgrades[i].rate;
    checkProgress();
    render();
    // Restart autoInt
    clearInterval(autoInt);
    autoInt = setInterval(() => {
      if (gameOver) return;
      words += autoRate * 0.5;
      checkProgress();
      updateDisplay();
    }, 500);
  };

  function updateDisplay() {
    const wc = document.querySelector('.word-counter');
    const pb = document.querySelector('.progress-bar-fill');
    if (wc) wc.textContent = Math.floor(words);
    if (pb) pb.style.width = Math.min(100,words/goal*100)+'%';
    upgrades.forEach((u,i) => {
      const btn = document.getElementById('upg-'+i);
      if (btn && !u.owned) btn.className = `upg-btn ${words>=u.cost?'unlocked':''}`;
    });
  }

  function checkProgress() {
    if (!midDone && words >= Math.floor(goal/2)) {
      midDone = true;
      gameOver = true;
      clearInterval(autoInt);
      showMidQ(lv.gameConfig.mid, () => {
        gameOver = false;
        autoInt = setInterval(() => {
          if (gameOver) return;
          words += autoRate * 0.5;
          checkProgress();
          updateDisplay();
        }, 500);
      });
    }
    if (words >= goal && !gameOver) {
      gameOver = true;
      clearInterval(autoInt);
      showWin(dayIdx, `clearInterval(autoInt);startIncremental(${dayIdx})`);
    }
  }

  render();
}

// ── WANDER (Fri - Obadiah) ────────────────────────────────────────────────────
function startWander(dayIdx) {
  const lv = LEVELS[dayIdx];
  const cfg = lv.gameConfig;
  const bigKids = G.mode === 'big';
  const goal = bigKids ? Math.ceil(cfg.goal * 1.6) : cfg.goal;
  let score = 0, lives = 3, timer = 70, midDone = false, gameOver = false;
  let items = [], raf;

  showScreen(`
    <div class="scr-header">
      <button class="back-btn" onclick="gameOver=true;cancelAnimationFrame(raf);goHub()">←</button>
      <span class="scr-title">${lv.icon} ${lv.title}</span>
    </div>
    <div style="font-size:.8rem;color:#caf0f8;text-align:center">${cfg.hint}</div>
    <div class="game-wrap" id="gWrap" style="background:${cfg.bg}">
      ${gameHeader(dayIdx, score, goal, bigKids?lives:null, bigKids?timer:null)}
      <div class="game-canvas" id="gCanvas"></div>
      <div class="ground-bar">${cfg.ground}</div>
    </div>
  `);

  const wrap = document.getElementById('gWrap');
  const canvas = document.getElementById('gCanvas');
  const W = wrap.offsetWidth, H = wrap.offsetHeight - 52;

  function spawnItem() {
    if (gameOver) return;
    const isBad = bigKids && Math.random() < 0.25;
    const emoji = isBad ? cfg.bad : cfg.alt[Math.floor(Math.random()*cfg.alt.length)];
    const el = document.createElement('div');
    el.className = 'item';
    el.textContent = emoji;
    let x = 20 + Math.random()*(W-50), y = 60 + Math.random()*(H-120);
    let vx = (Math.random()-0.5)*60, vy = (Math.random()-0.5)*60;
    el.style.left = x+'px'; el.style.top = y+'px';
    canvas.appendChild(el);
    const item = {el, x, y, vx, vy, isBad};
    items.push(item);
    el.addEventListener('click', () => {
      if (gameOver) return;
      burst(canvas, x, y, isBad ? '💥' : cfg.turn);
      el.remove(); items = items.filter(it=>it.el!==el);
      if (!isBad) {
        score++;
        document.querySelector('.info-bar span').textContent = `${lv.icon} ${score}/${goal}`;
        document.getElementById('progBar').style.width = Math.min(100,score/goal*100)+'%';
        if (!midDone && score >= Math.floor(goal/2)) {
          midDone = true; gameOver = true;
          cancelAnimationFrame(raf);
          showMidQ(lv.gameConfig.mid, ()=>{ gameOver=false; raf=requestAnimationFrame(loop); });
        }
        if (score >= goal) { gameOver=true; cancelAnimationFrame(raf); showWin(dayIdx,`startWander(${dayIdx})`); }
      } else if (bigKids) {
        lives--; document.querySelector('.lives-row').textContent='❤️'.repeat(Math.max(0,lives));
        if (lives<=0) { gameOver=true; cancelAnimationFrame(raf); showGameOver(dayIdx); }
      }
    });
  }

  let last = 0;
  function loop(ts) {
    if (gameOver) return;
    const dt = Math.min(0.05,(ts-last)/1000); last=ts;
    items.forEach(it => {
      it.x += it.vx*dt; it.y += it.vy*dt;
      if (it.x<10||it.x>W-40) it.vx*=-1;
      if (it.y<50||it.y>H-40) it.vy*=-1;
      it.x=Math.max(10,Math.min(W-40,it.x)); it.y=Math.max(50,Math.min(H-40,it.y));
      it.el.style.left=it.x+'px'; it.el.style.top=it.y+'px';
    });
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);

  const spawnInt = setInterval(()=>{ if (!gameOver) spawnItem(); }, 1200);
  if (bigKids) {
    const tInt = setInterval(()=>{
      if (gameOver){clearInterval(tInt);return;}
      timer--; const tt=document.querySelector('.timer-txt'); if(tt) tt.textContent=`⏱ ${timer}s`;
      if (timer<=0){gameOver=true;clearInterval(tInt);clearInterval(spawnInt);cancelAnimationFrame(raf);showGameOver(dayIdx);}
    },1000);
  }
}

// ── JONAH PRAYER GAME (Sat) ───────────────────────────────────────────────────
function startJonah(dayIdx) {
  const lv = LEVELS[dayIdx];
  const cfg = lv.gameConfig;
  const bigKids = G.mode === 'big';
  const prayGoal = bigKids ? 15 : cfg.prayerGoal;
  let prayCount = 0, midDone = false, gameOver = false, despairs = [];

  showScreen(`
    <div class="scr-header">
      <button class="back-btn" onclick="gameOver=true;goHub()">←</button>
      <span class="scr-title">${lv.icon} ${lv.title}</span>
    </div>
    <div style="font-size:.8rem;color:#caf0f8;text-align:center">${cfg.hint}</div>
    <div class="game-wrap whale-bg" id="gWrap">
      <div class="prayer-meter"><div class="prayer-fill" id="pFill" style="width:0%"></div></div>
      <div style="position:absolute;top:16px;left:0;right:0;text-align:center;color:#90e0ef;font-size:.75rem;font-weight:700;z-index:5">Faith meter ${prayCount}/${prayGoal}</div>
      <div class="jonah-sprite">🧑</div>
      <div class="wave-anim"></div>
      <div class="game-canvas" id="gCanvas"></div>
      <button class="pray-action-btn" id="prayBtn" onclick="doPray()">🙏 Pray</button>
    </div>
  `);

  const wrap = document.getElementById('gWrap');
  const canvas = document.getElementById('gCanvas');
  const W = wrap.offsetWidth, H = wrap.offsetHeight;

  function spawnDespair() {
    if (gameOver) return;
    const em = cfg.despairItems[Math.floor(Math.random()*cfg.despairItems.length)];
    const el = document.createElement('div');
    el.className = 'despair-wave';
    el.textContent = em;
    el.style.left = (Math.random()*(W-40))+'px';
    el.style.top = '-40px';
    canvas.appendChild(el);
    despairs.push({el, y:-40, speed: 40+Math.random()*30});
  }

  window.doPray = () => {
    if (gameOver) return;
    prayCount++;
    document.getElementById('pFill').style.width = Math.min(100,prayCount/prayGoal*100)+'%';
    document.querySelector('[style*="Faith meter"]').textContent = `Faith meter ${prayCount}/${prayGoal}`;
    // Push waves back
    despairs.forEach(d => { d.y -= 60; d.el.style.top = d.y+'px'; });
    despairs = despairs.filter(d => { if (d.y < -60) { d.el.remove(); return false; } return true; });
    burst(canvas, W/2-20, H-100, '✨');
    if (!midDone && prayCount >= Math.floor(prayGoal/2)) {
      midDone = true;
      showMidQ(lv.gameConfig.mid, ()=>{});
    }
    if (prayCount >= prayGoal) {
      gameOver = true;
      clearInterval(spawnInt);
      cancelAnimationFrame(raf);
      showWin(dayIdx, `startJonah(${dayIdx})`);
    }
  };

  const spawnInt = setInterval(()=>{ if (!gameOver) spawnDespair(); }, bigKids?1200:1800);
  let raf;
  function loop() {
    if (gameOver) return;
    despairs.forEach(d => { d.y += 0.8; d.el.style.top = d.y+'px'; });
    despairs = despairs.filter(d => {
      if (d.y > H-80) {
        d.el.remove();
        if (bigKids) {
          // In big kids mode, reaching the bottom costs prayer
          prayCount = Math.max(0, prayCount-1);
          document.getElementById('pFill').style.width = Math.min(100,prayCount/prayGoal*100)+'%';
        }
        return false;
      }
      return true;
    });
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);
}

// ── STORM / CATCH (Sun - Jonah 3-4) ──────────────────────────────────────────
function startStorm(dayIdx) {
  const lv = LEVELS[dayIdx];
  const cfg = lv.gameConfig;
  const bigKids = G.mode === 'big';
  const goal = bigKids ? Math.ceil(cfg.goal*1.6) : cfg.goal;
  let score = 0, lives = 3, timer = 70, midDone = false, gameOver = false;
  let items = [];

  showScreen(`
    <div class="scr-header">
      <button class="back-btn" onclick="gameOver=true;goHub()">←</button>
      <span class="scr-title">${lv.icon} ${lv.title}</span>
    </div>
    <div style="font-size:.8rem;color:#caf0f8;text-align:center">${cfg.hint}</div>
    <div class="game-wrap" id="gWrap" style="background:${cfg.bg}">
      ${gameHeader(dayIdx, score, goal, bigKids?lives:null, bigKids?timer:null)}
      <div class="game-canvas" id="gCanvas"></div>
      <div class="ground-bar">${cfg.ground}</div>
    </div>
  `);

  const wrap = document.getElementById('gWrap');
  const canvas = document.getElementById('gCanvas');
  const W = wrap.offsetWidth, H = wrap.offsetHeight - 52;

  function spawnFalling() {
    if (gameOver) return;
    const isBad = bigKids && Math.random() < 0.3;
    const emoji = isBad ? cfg.bad : cfg.alt[Math.floor(Math.random()*cfg.alt.length)];
    const el = document.createElement('div');
    el.className = 'falling-item';
    el.textContent = emoji;
    const x = 20+Math.random()*(W-50);
    el.style.left = x+'px'; el.style.top = '-40px';
    canvas.appendChild(el);
    let y = -40;
    const speed = (bigKids?130:95) + Math.random()*40;
    let done = false;
    const fall = setInterval(()=>{
      if (gameOver||done){clearInterval(fall);return;}
      y += speed/30;
      el.style.top = y+'px';
      if (y > H-20) {
        el.remove(); clearInterval(fall); done=true;
        items=items.filter(it=>it.el!==el);
        if (!isBad) {
          if (bigKids) { lives--; document.querySelector('.lives-row').textContent='❤️'.repeat(Math.max(0,lives)); if(lives<=0){gameOver=true;showGameOver(dayIdx);} }
        }
      }
    }, 33);
    const item = {el, isBad};
    items.push(item);
    el.addEventListener('click', ()=>{
      if (gameOver||done) return;
      done=true; clearInterval(fall);
      burst(canvas,x,y,isBad?'💥':cfg.turn);
      el.remove(); items=items.filter(it=>it.el!==el);
      if (!isBad) {
        score++;
        document.querySelector('.info-bar span').textContent=`${lv.icon} ${score}/${goal}`;
        document.getElementById('progBar').style.width=Math.min(100,score/goal*100)+'%';
        if (!midDone&&score>=Math.floor(goal/2)){
          midDone=true;
          showMidQ(lv.gameConfig.mid,()=>{});
        }
        if (score>=goal){gameOver=true;showWin(dayIdx,`startStorm(${dayIdx})`);}
      } else if (bigKids) {
        lives--; document.querySelector('.lives-row').textContent='❤️'.repeat(Math.max(0,lives));
        if(lives<=0){gameOver=true;showGameOver(dayIdx);}
      }
    });
  }

  const spawnInt = setInterval(()=>{ if(!gameOver) spawnFalling(); }, bigKids?700:950);
  if (bigKids) {
    const tInt = setInterval(()=>{
      if(gameOver){clearInterval(tInt);return;}
      timer--; const tt=document.querySelector('.timer-txt'); if(tt) tt.textContent=`⏱ ${timer}s`;
      if(timer<=0){gameOver=true;clearInterval(tInt);clearInterval(spawnInt);showGameOver(dayIdx);}
    },1000);
  }
}
